services:
  catalog-db:
    image: postgres:17-alpine
    container_name: BookQHub-catalog-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: BookQHub_catalog
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U catalog_user -d BookQHub_catalog
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog_postgres_data:
